name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test ./... 2>&1 | tee test-output.txt

      # Emit the tail of the test output as a single workflow annotation so the
      # failure is readable from the check-run API without downloading logs.
      - name: Surface test failures
        if: failure()
        shell: bash
        run: |
          out=$(grep -aE '(--- FAIL|^FAIL|panic:|fatal error:|_test\.go:[0-9]+:|no such|timed out|listen|dial)' test-output.txt | tr -d '\r' | tr '\n' '~' | cut -c1-6000)
          echo "::error title=test-failures::$out"

      - name: macOS diagnostics
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          info="uname=$(uname -a) | go=$(go version) | GOOS=$(go env GOOS)/$(go env GOARCH) CGO=$(go env CGO_ENABLED) | ulimit_n=$(ulimit -n)"
          q=$(go test -v -count=1 ./internal/qemu/ 2>&1 | tr -d '\r' | tr '\n' '~' | tail -c 2200)
          n=$(go test -v -count=1 ./cmd/nildap/ 2>&1 | tr -d '\r' | tr '\n' '~' | tail -c 2200)
          t=$(tail -c 1200 test-output.txt | tr -d '\r' | tr '\n' '~')
          echo "::error title=macos-env::$info"
          echo "::error title=macos-qemu::$q"
          echo "::error title=macos-nildap::$n"
          echo "::error title=macos-tail::$t"

      - name: Build
        run: |
          go build -o bin/nilemu .
          go build -o bin/nilosd ./cmd/nilosd
          go build -o bin/nilctl ./cmd/nilctl
          go build -o bin/nilsign ./cmd/nilsign
          go build -o bin/nilsp ./cmd/nilsp
          go build -o bin/nildap ./cmd/nildap
          go build -o bin/nilstudio ./cmd/nilstudio

  lightweight-budget:
    name: lightweight budget
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build and measure
        run: |
          go build -ldflags "-s -w" -o bin/nilemu .
          size=$(stat -c%s bin/nilemu)
          echo "nilemu binary size: $size bytes"
          # Budget: a single static binary under 30 MB.
          if [ "$size" -gt 31457280 ]; then
            echo "::error::binary exceeds 30MB budget"; exit 1
          fi
