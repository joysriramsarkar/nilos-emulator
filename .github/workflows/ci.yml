name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Go 1.24+ emits the Mach-O LC_UUID load command that the macOS 26
      # runner's dyld requires. Older Go toolchains omit it, so their test
      # binaries abort with "missing LC_UUID load command -> signal: abort trap"
      # before any test runs on the macos-latest (macOS 26 / arm64) image.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test ./... 2>&1 | tee test-output.txt

      # Emit the tail of the test output as a single workflow annotation so the
      # failure is readable from the check-run API without downloading logs.
      - name: Surface test failures
        if: failure()
        shell: bash
        run: |
          out=$(grep -aE '(--- FAIL|^FAIL|panic:|fatal error:|_test\.go:[0-9]+:|no such|timed out|listen|dial|missing LC_UUID|abort trap)' test-output.txt | tr -d '\r' | tr '\n' '~' | cut -c1-6000)
          echo "::error title=test-failures::$out"

      - name: Build
        run: |
          go build -o bin/nilemu .
          go build -o bin/nilosd ./cmd/nilosd
          go build -o bin/nilctl ./cmd/nilctl
          go build -o bin/nilsign ./cmd/nilsign
          go build -o bin/nilsp ./cmd/nilsp
          go build -o bin/nildap ./cmd/nildap
          go build -o bin/nilstudio ./cmd/nilstudio

  lightweight-budget:
    name: lightweight budget
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Build and measure
        run: |
          go build -ldflags "-s -w" -o bin/nilemu .
          size=$(stat -c%s bin/nilemu)
          echo "nilemu binary size: $size bytes"
          # Budget: a single static binary under 30 MB.
          if [ "$size" -gt 31457280 ]; then
            echo "::error::binary exceeds 30MB budget"; exit 1
          fi
